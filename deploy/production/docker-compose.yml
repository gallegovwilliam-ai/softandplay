services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: "no"
    environment: &app-env
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Bogota}
      DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-es-co}
      SOFTANDPLAY_STRICT_CONFIG: "True"
      SECURE_SSL_REDIRECT: "True"
      EMAIL_HOST: ${EMAIL_HOST:-smtpout.secureserver.net}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/static_files
      - media_data:/app/media_files
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py check --deploy"]

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/static_files:ro
      - media_data:/app/media_files
    expose: ["8000"]
    command: ["gunicorn", "app.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]

  asgi:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/static_files:ro
      - media_data:/app/media_files
    expose: ["9000"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "9000", "app.asgi:application"]

  worker:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "rqworker", "default"]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      asgi:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
