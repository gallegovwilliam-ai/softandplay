upstream softandplay_web { server web:8000; }
upstream softandplay_asgi { server asgi:9000; }

server {
    listen 80;
    server_name appsoftandplay.com www.appsoftandplay.com;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name appsoftandplay.com www.appsoftandplay.com;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/appsoftandplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appsoftandplay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /media/;
    }

    location /ws/ {
        proxy_pass http://softandplay_asgi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }

    location / {
        proxy_pass http://softandplay_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
