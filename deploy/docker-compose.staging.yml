services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-softandplay}
      POSTGRES_USER: ${POSTGRES_USER:-softandplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &app-env
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-softandplay}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-softandplay}
      REDIS_URL: redis://redis:6379/0
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-America/Bogota}
      SOFTANDPLAY_STRICT_CONFIG: "True"
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/static_files
      - media_data:/app/media_files
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/static_files:ro
      - media_data:/app/media_files
    expose:
      - "8000"
    command: ["gunicorn", "app.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]

  asgi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/static_files:ro
      - media_data:/app/media_files
    expose:
      - "9000"
    command: ["daphne", "-b", "0.0.0.0", "-p", "9000", "app.asgi:application"]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      <<: *app-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "rqworker", "default"]

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      web:
        condition: service_started
      asgi:
        condition: service_started
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
