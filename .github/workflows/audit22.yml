name: SoftAndPlay Audit 22

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requeriments
      - name: Compile Python
        run: python -m compileall -q .
      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-for-production
          DJANGO_DEBUG: 'True'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
