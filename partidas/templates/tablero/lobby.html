{% extends 'tablero/base.html' %}
{% load static %}

{% block main %}
{% for p in object_list  %}
	<div class="card">
		{{p}}
		{% if object_list.0.pk == p.pk %}
      {% if user.is_superuser %}
        <a href="Javascript:inicioreload('{{p.pk}}')" class="btn">Iniciar</a>
      {% endif %}
    {% endif %}
	</div>
{% endfor %}
<br>
<a href="/">Regresar</a>
{% endblock main %}

{% block js %}
	<script type="text/javascript">


	    var loc = window.location;
	    var wsStart = "ws://";
	    if (loc.protocol == "https:"){
	        wsStart = "wss://";
	    }
	    var webSocketEndpoint =  wsStart + loc.host + '/notifications/partida/';  // ws : wss   // Websocket URL, Same on as mentioned in the routing.py
   var socket = new WebSocket(webSocketEndpoint); // Creating a new Web Socket Connection
    // Socket On receive message Functionality
    socket.onmessage = function(e){
        console.log('message', e);
          data = JSON.parse(e.data);
          if(data.reload == 'SI'){location.reload();return false;};
    };
    // Socket Connet Functionality
    socket.onopen = function(e){
       console.log('open',e);
    };
    // Socket Error Functionality
    socket.onerror = function(e){
        console.log('error',e);
    };
    // Socket close Functionality
    socket.onclose = function(e){
        console.log('closed',e);
    };
  //FIN WEBSOCKET


    function inicioreload(pk){
    	$.post("{% url 'inicarPartida' 1234 %}".replace(/1234/, pk.toString()), {csrfmiddlewaretoken: '{{ csrf_token }}'}, function(e){
          if (e == 'ok'){
			     data = {'reload':'SI'};
			     var msg = {
			      type: "notify",
			      text: JSON.stringify(data),
			     };
			     // Send the msg object as a JSON-formatted string.
			     socket.send(JSON.stringify(msg));
         }
    	});
    	}
	</script>
{% endblock js %}
