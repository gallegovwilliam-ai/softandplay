{% load static %}
<html lang="es">
<title>{{config.titulo}}</title>
<Head>

<link rel="stylesheet" type="text/css" href="{% static 'login/bootstrapv400.min.css' %}">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1" />

<style type="text/css">
body {
margin:0px;
padding:0px;
    font-family: 'Mukta', sans-serif;
    background: url("/media/{{config.fondo_login_mobile}}") no-repeat center center fixed;    
    background-size: cover;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    -ms-background-size: cover;
	position: relative;
    height: 100vh;
}
.lbl {
color:#ffffff;
font: bold 1em 'Arial';
text-decoration:none;
}
.lbl:hover {
color:#ffffff;
font: bold 1em 'Arial';
text-decoration:normal;
}
.INGRESAR {
margin:0px auto;
margin-top:2em;
font: bold 1.2em 'Arial';
padding: 0.5em 2.5em;
color:rgb(204,39,33);
border-radius: 20px;
text-align:center;
border: 1px solid #ffffff;
background:transparent;
cursor:pointer;
}
.INGRESAR:hover {
color:rgb(225,79,74);
}
.inpt {
margin:0px auto;
font: bold 1em 'Arial';
width: 100%;
background: transparent;
padding: 0.5em;
outline: none;
margin: 0.5em auto;
border:0px;
border-bottom: 2px solid #ffffff;
color: #ffffff;
}
</style>
</Head>
<body>
	<div style="background:rgb(0,0,0,0.5);width:100%;zoom:0.89;padding:1.5em 0px;z-index:0;">
		<form id="form">
        {%csrf_token%}
		<div class="container" style="text-align:center;margin-top:0em;">
			<h1 style="color:rgb(199,48,119)">¡Hola, bienvenid@!</h1>
			<img src="/media/{{config.logo}}" style="width:25%" style="z-index:9999;" alt="Imagen con el texto Gran Bingo - ¡Amarás Tu Suerte!"></img>
			<div class="row" style="margin-top:2em;margin-bottom:3em;">
				<div class="col-xl-4 col-2"></div>
				<div class="col-xl-4 col-8">
					<div class="forms" action="" method="post">
						<input class="inpt" type="text" title="Ingresa tu username" id="username" placeholder="Usuario">
						<input class="inpt" type="password" title="Ingresa tu contraseña" id="password" placeholder="Contraseña">
                        <div id="error" style="text-align:center;color:#fff"></div>
                    </div>
				</div>
				<div class="col-xl-4 col-2"></div>
				<input class="INGRESAR" type="submit" name="INGRESAR" value="INGRESAR"></input>
				<div style="text-align:center;width:100%;margin-top:0.7em;">
					<a class="lbl" href="">¿Olvidaste contraseña?</a>
                </div>
                    <div style="margin:0px auto;margin-top:1em;width:300px;padding:1em;border-radius:30px;zoom:1;border: 3px solid rgb(251,242,79);background:rgba(53,23,73,0.8);">
                        <a href="{% url 'register-form' %}" class="">
                            <h2 style="color:rgb(229,32,124);">¡REGISTRATE GRATIS AQUÍ!</h2>
                            <p style="font:bold 1em 'Arial';color:rgb(251,242,79);">Fácil, rápido y seguro.</p>
                        </a>
                </div>
			</div>
		</div>
		</form>
	</div>

    <script src="{% static 'js/jquery.js' %}"></script>


<script type="text/javascript">
  $('#form').submit(function(){
          var formData = new FormData();
          formData.append('username',$('#username').val());
          formData.append('password',$('#password').val());
          formData.append('csrfmiddlewaretoken', $("input[name='csrfmiddlewaretoken']").val());
           $.ajax({
                    type: "POST",
                    url: "{% url 'login-form' %}",
                    data: formData, // serializes the form's elements.
                    enctype: 'multipart/form-data',         
                    processData: false,  // tell jQuery not to process the data
                    contentType: false,  // tell jQuery not to set contentType           
                    success: function(data)
                   {
                   if(data=='passwordError'){
                    $('#error').html("Usuario o Clave Incorrectos");
                     }else if(data=='block'){
                        $('#error').html("Usuario BLOQUEADO");
                     }else{
                        location.href='/';
                     }
                      
                      
                   }
                 });
  event.preventDefault();});
</script>

<body>
</html>
