{% extends 'dashboard.html' %}
 {% load static %}
 {% load humanize %}

{% block main %}
    <div class="row">
    	<div class="col-sm-12">
    		<section class="card">
            	<header class="card-header">
                  	Conprar
            	</header>
              	<div class="card-body">
                      <h3>{{tipo}}</h3>
                      <h4>Partida: {{partida.pk}} / Costo Tabla: {{partida.monto_carton}}$ </h4>
                        <h6>la respuesta o aprovacion puede tardar 30 minutos</h6>  
                      <form action="" method="POST" id="form">
                          {% csrf_token %}
                          <label for="">Cantidad</label>
                          <select name="cantidad" id="cantidad" class="form-control" onchange="calculo()">
                            <option value="0">Seleccione Cantidad</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                              <option value="3">3</option>
                              <option value="4">4</option>
                              <option value="5">5</option>
                          </select>
                          <br>
                          <select style="display:none" name="banco" id="banco" class="form-control" onchange="Javascript:BancosView()">
                            <option value="0" selected>Seleccione Metodo de pago</option>
                                <option value="paypal">Paypal</option>
                            {% for b in bancos %}
                                <option value="{{b.pk}}">{{b.moneda}} / {{b.corresponsal}}</option>
                            {% endfor %}

                          </select>
                          <br>
                          <div id="bancoInfo">
                          </div>
                          <br>
                          <div> 
                            <div id="ref" style="display:none">
                                <label for="">Referencia</label>
                                <input type="text" id="referencia" class="form-control">
                                <br>
                            </div>
                                <div class="custom-file" style="display:none" id="filediv">
                                <input type="file" class="custom-file-input" id="file" lang="es">
                                <label class="custom-file-label" for="customFileLang">Sube Capture de Transferencia</label>
                                </div>  
                          <h3 id="total" style="text-align: right;">Total: </h3>
                          
                          <button type="submit" id="pagarbtn" style="display:none" class="btn btn-primary">Comprar</button>	
                            <div style="width: 200px;display:none;" id="paypalpago" ></div>
                                <script src="https://www.paypal.com/sdk/js?client-id=ARTjq8MR8rDhyCMn67s8OLvkmWjYFzyJiCt4eeoTtg28gxkjcSr6DRffqF_E4xzOUKRfwYdqLvKpV_LK"></script>
                                <script>paypal.Buttons({
                                    createOrder: function(data, actions) {
                                      // This function sets up the details of the transaction, including the amount and line item details.
                                      return actions.order.create({
                                        purchase_units: [{
                                          amount: {
                                            value: Total
                                          }
                                        }]
                                      });
                                    },
                                    onApprove: function(data, actions) {
                                      // This function captures the funds from the transaction.
                                      return actions.order.capture().then(function(details) {
                                        // This function shows a transaction success message to your buyer.
                                        alert('Transaction completed by ' + details.payer.name.given_name);
                                      
                                        $.post('/bancos/pagar-paypal/{{partida.pk}}/',
                                          {cantidad:$('#cantidad').val(),
                                          referencia:data.orderID,
                                          csrfmiddlewaretoken: $("input[name='csrfmiddlewaretoken']").val()},function( data ) {
                                              alert( "Pago Exitoso");
                                              window.location = '/';
                                        });
                                      
                                      });
                                    }
                                  }).render('#paypalpago');</script>
              		</form>

              	</div>
          	</section>
      	</div>
  </div>

{% endblock %}

{% block js %}
	<script>

   
        var monto = {{partida.monto_carton}};
        var cuenta = '';
        $('#total').html("Total: " + (monto * $('#cantidad').val()) + "$")
        Total = monto * $('#cantidad').val()
        
        function calculo(){
            $('#banco').show();
            $('#total').html("Total: " + (monto * $('#cantidad').val()) + "$")
            Total = monto * $('#cantidad').val()
        }


        function BancosView(){
            if($('#banco').val() == 'paypal'){
                $('#paypalpago').show();
                $('#pagarbtn').hide();
                $('#filediv').hide();
                $('#ref').hide();
                $('#bancoInfo').html('');
            }else{
                $('#paypalpago').hide();
                $('#pagarbtn').show();
                $('#filediv').show();
                $('#ref').show();
                $.get("{% url 'banco-view'%}",{'pk':$('#banco').val()})
                .done(function( data ) {
                    if (data!='error'){
                        cuenta = data.cuenta;
                        html = "Momeda: <strong> " + data.moneda + "</strong> / Corresponsal: <strong>" + data.corresponsal + "</strong> / ";
                        html = html + "Ciudad: <strong>" + data.ciudad + "</strong> / Codigo Swift: <strong>" + data.codigo_swift + "</strong> / ";
                        html = html + "Banco Benef.: <strong>" + data.banco_benef + "</strong> / cuenta: <strong>" + data.cuenta + "</strong>"; 
                        html = html + " / Beneficiario final: <strong>" + data.beneficiario_final + "</strong> / Cuenta Abono: <strong>" + data.cuenta_abono + "</strong>"; 
                        $('#bancoInfo').html(html);
                    }else{$('#bancoInfo').html('');}
                });
            }
        }

 
        $( "#form" ).submit(function( event ) {
          btn = document.getElementById('pagarbtn');
            btn.disabled = true;
            if($('#banco').val()=='0'){
                alert('Debe Seleccionar el Banco');
                return false;
            }

            if($('#referencia').val()==''){
                alert('Debe indicar la referencia');
                return false;
            }       

            if($('#file').val()==''){
                alert('Debe adjuntar la captura de la transaccion');
                return false;
            }

            var formData1 = new FormData();
            formData1.append('cantidad',$('#cantidad').val());
            formData1.append('banco',$('#banco').val());
            formData1.append('referencia',$('#referencia').val());
            formData1.append('cuenta', cuenta);
            formData1.append('csrfmiddlewaretoken', $("input[name='csrfmiddlewaretoken']").val());
            formData1.append('file', $('#file')[0].files[0]);
            $.ajax({
                    type: "POST",
                    url: '/bancos/pagar/{{partida.pk}}/',
                    enctype: 'multipart/form-data',         
                    data: formData1, // serializes the form's elements.
                    processData: false,  // tell jQuery not to process the data
                    contentType: false,  // tell jQuery not to set contentType           
                    success: function(data)
                    {
                        alert('Su compra esta proceso, le estaremos notificando');
                        window.location = '/';
                    }
                    });
            return false;
});



    </script>




{% endblock js %}
